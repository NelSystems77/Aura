services:
  aura:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      WHATSAPP_NUMBER: ${WHATSAPP_NUMBER}
      SITE_URL: ${SITE_URL}
      NODE_ENV: production
      DB_PATH: /app/var/data/aura.db
    volumes:
      - aura-data:/app/var/data

volumes:
  aura-data:
